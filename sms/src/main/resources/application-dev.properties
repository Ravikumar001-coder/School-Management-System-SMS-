# ============================================================
# application-dev.properties — LOCAL DEVELOPMENT PROFILE
# ============================================================
# Activated with: --spring.profiles.active=dev
# Or set SPRING_PROFILES_ACTIVE=dev in .env

# ── Database ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:826001}

# ── JPA / Hibernate ─────────────────────────────────────────
# Keep update in dev for rapid iteration; prod uses validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Mail (stub in dev) ──────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev@localhost}
spring.mail.password=${MAIL_PASSWORD:dev-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Logging ─────────────────────────────────────────────────
logging.level.com.school.sms=DEBUG
logging.level.org.springframework.security=INFO
# ── Flyway ──────────────────────────────────────────────────
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=7
spring.flyway.validate-on-migrate=false
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
