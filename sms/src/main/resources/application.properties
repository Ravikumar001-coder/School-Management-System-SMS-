# ============================================================
# application.properties — COMMON CONFIGURATION
# ============================================================
# Profile-specific settings live in:
#   application-dev.properties   (local dev)
#   application-prod.properties  (production)
#
# Activate profile:
#   Dev:  spring.profiles.active=dev  (or set in .env)
#   Prod: SPRING_PROFILES_ACTIVE=prod  (set in OS env)

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Driver ──────────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA Dialect ─────────────────────────────────────────────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Cache ───────────────────────────────────────────────────
spring.cache.type=simple

# ── JWT ─────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── Redis ───────────────────────────────────────────────────
spring.redis.host=localhost
spring.redis.port=6379


# ── Frontend CORS ───────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ── Demo Seeding ────────────────────────────────────────────
app.demo.seed=true

# ── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB