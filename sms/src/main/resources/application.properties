# ============================================
# src/main/resources/application.properties
# ============================================

# ============================================
# MYSQL DATABASE CONFIGURATION
# ============================================

# ✅ MySQL URL format (different from PostgreSQL)
# PostgreSQL was: jdbc:postgresql://localhost:5432/school_db
# MySQL is:       jdbc:mysql://localhost:3306/school_db

spring.datasource.url=jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:826001}

# ✅ MySQL Driver (different from PostgreSQL)
# PostgreSQL was: org.postgresql.Driver
# MySQL is:       com.mysql.cj.jdbc.Driver

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================

# ✅ MySQL Dialect (different from PostgreSQL)
# PostgreSQL was: org.hibernate.dialect.PostgreSQLDialect
# MySQL is:       org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Auto create/update tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console (helpful for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CACHE CONFIGURATION
# ============================================
# Use local in-memory cache to avoid hard dependency on Redis in dev.
spring.cache.type=simple

# ============================================
# JWT CONFIGURATION
# ============================================
app.jwt.secret=${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration=86400000

# ============================================
# SERVER
# ============================================
server.port=8080

# ============================================
# FRONTEND URL (for CORS)
# ============================================
app.frontend.url=http://localhost:3000

# ============================================
# DEMO DATA SEEDING
# ============================================
app.demo.seed=true

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# application.properties - Add these
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:yourschool@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true