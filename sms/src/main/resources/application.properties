# ============================================
# src/main/resources/application.properties
# ============================================

# Load secrets from .env file in the project root (parent of this module).
# Spring Boot reads key=value format natively — no extra library needed.
# The 'optional:' prefix means the app still starts if .env is missing (e.g. in CI with real env vars).
spring.config.import=optional:file:../.env[.properties]

# ============================================
# MYSQL DATABASE CONFIGURATION
# ============================================

# ✅ MySQL URL format (different from PostgreSQL)
# PostgreSQL was: jdbc:postgresql://localhost:5432/school_db
# MySQL is:       jdbc:mysql://localhost:3306/school_db

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ✅ MySQL Driver (different from PostgreSQL)
# PostgreSQL was: org.postgresql.Driver
# MySQL is:       com.mysql.cj.jdbc.Driver

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================

# ✅ MySQL Dialect (different from PostgreSQL)
# PostgreSQL was: org.hibernate.dialect.PostgreSQLDialect
# MySQL is:       org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Auto create/update tables
# 'update' mode keeps your data safe between restarts.
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console (helpful for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CACHE CONFIGURATION
# ============================================
# Use local in-memory cache to avoid hard dependency on Redis in dev.
spring.cache.type=simple

# ============================================
# JWT CONFIGURATION
# ============================================
# Access token: 15 minutes (900_000 ms) — short-lived by design
app.jwt.expiration=900000
# Refresh token: 7 days (604_800_000 ms) — stored HASHED in DB, delivered via HttpOnly cookie
app.jwt.refresh-expiration=604800000
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sms-api
app.jwt.audience=sms-frontend

# ============================================
# SECURITY COOKIE
# ============================================
# Set to true in production (requires HTTPS), false for local HTTP development
app.security.cookie.secure=false

# ============================================
# SERVER
# ============================================
server.port=8080

# ============================================
# FRONTEND URL (for CORS)
# ============================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ============================================
# DEMO DATA SEEDING
# ============================================
app.demo.seed=true

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# application.properties - Add these
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true